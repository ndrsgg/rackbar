# Generate Rackbar.xcodeproj with `xcodegen` (brew install xcodegen).
# The project file is not checked in; this is.
name: Rackbar
options:
  bundleIdPrefix: app.rackbar
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Rackbar.xcconfig
  Release: Config/Rackbar.xcconfig
packages:
  RackbarCore:
    path: RackbarCore
targets:
  Rackbar:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: RackbarCore
    settings:
      base:
        PRODUCT_NAME: Rackbar
        PRODUCT_BUNDLE_IDENTIFIER: app.rackbar.Rackbar
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Rackbar.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: YES
schemes:
  Rackbar:
    build:
      targets:
        Rackbar: all
    run:
      config: Debug
