<!doctype html>
<!-- Social preview, 1280 × 640. Rendered to site/public/og.png by render.sh;
     upload the same file under GitHub → Settings → Social preview. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Schibsted Grotesk'; src: url(../site/public/fonts/schibsted-grotesk-latin.woff2) format('woff2'); font-weight: 400 900; }
  @font-face { font-family: 'IBM Plex Mono'; src: url(../site/public/fonts/ibm-plex-mono-latin-400.woff2) format('woff2'); font-weight: 400; }
  html, body { margin: 0; }
  body {
    position: relative;
    width: 1280px;
    height: 640px;
    box-sizing: border-box;
    padding: 80px 96px;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 72px;
    align-items: center;
    background: #0E0F11;
    font-family: 'Schibsted Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img { margin: -30px; }
  .copy { display: flex; flex-direction: column; gap: 26px; }
  .word { display: flex; align-items: baseline; font: 600 112px/1 'Schibsted Grotesk'; letter-spacing: -0.035em; color: #F5F6F7; }
  .word i { display: inline-block; width: .42em; height: .09em; margin-left: .06em; background: #34D17E; border-radius: 3px; }
  .line { font: 500 34px/1.25 'Schibsted Grotesk'; letter-spacing: -0.015em; color: #B3B9C2; text-wrap: balance; }
  .cmd { font: 400 24px 'IBM Plex Mono'; color: #F5F6F7; }
  .cmd span { color: #6A717C; }
  .foot { position: absolute; left: 96px; right: 96px; bottom: 40px; display: flex; justify-content: space-between; font: 400 16px 'IBM Plex Mono'; color: #8C939E; }
</style>
</head>
<body>
  <img src="icon-dark.svg" width="300" height="300" alt="">
  <div class="copy">
    <div class="word">Rackbar<i></i></div>
    <div class="line">Hetzner Cloud servers in your macOS menu bar.</div>
    <div class="cmd"><span>$</span> ssh acme/web-1</div>
  </div>
  <div class="foot"><span>read-only · sandboxed · ssh config in sync</span><span>not affiliated with Hetzner</span></div>
</body>
</html>
